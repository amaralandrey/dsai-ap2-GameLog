  <details class="resumo-politica" open>
    <summary>A política de privacidade em poucas palavras</summary>
    <ul>{% for titulo, texto in resumo %}<li><strong>{{ titulo }}:</strong> {{ texto }}</li>{% endfor %}</ul>
  </details>
  <label style="font-weight:400"><input type="checkbox" name="aceite" value="1" style="width:auto" {{ 'checked' if form.get('aceite') }}>
    Li e aceito os <a href="/termos" target="_blank">termos de uso</a> e a <a href="/privacidade" target="_blank">política de privacidade</a></label>
  {% if errors.aceite %}<div class="err">{{ errors.aceite }}</div>{% endif %}
