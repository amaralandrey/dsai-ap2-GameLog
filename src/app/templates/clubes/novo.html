{% extends "base.html" %}
{% block title %}Novo clube — GameLog{% endblock %}
{% block content %}
<section class="panel" style="max-width:560px;margin:0 auto">
<h1>Novo clube</h1>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="nome">Nome</label><input id="nome" name="nome" maxlength="60" value="{{ form.get('nome', '') }}" required>
  {% if erros.nome %}<div class="err">{{ erros.nome }}</div>{% endif %}
  <label for="descricao">Descrição (até 500)</label><textarea id="descricao" name="descricao">{{ form.get('descricao', '') }}</textarea>
  {% if erros.descricao %}<div class="err">{{ erros.descricao }}</div>{% endif %}
  <label for="genero">Gênero-tema (opcional)</label>
  <select id="genero" name="genero"><option value="">—</option>{% for g in generos %}<option value="{{ g.slug }}" {{ 'selected' if form.get('genero') == g.slug }}>{{ g.name }}</option>{% endfor %}</select>
  {% if erros.genero %}<div class="err">{{ erros.genero }}</div>{% endif %}
  <label for="visibilidade">Visibilidade</label>
  <select id="visibilidade" name="visibilidade"><option value="publico">Público (qualquer um entra)</option><option value="privado" {{ 'selected' if form.get('visibilidade') == 'privado' }}>Privado (entrada por pedido)</option></select>
  <p><button>Criar clube</button> <a href="/clubes">Cancelar</a></p>
</form>
</section>
{% endblock %}
