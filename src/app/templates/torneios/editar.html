{% extends "base.html" %}
{% block title %}Editar {{ t.nome }} — GameLog{% endblock %}
{% block content %}
<section class="panel" style="max-width:560px;margin:0 auto">
<h1>Editar torneio</h1>
<form method="post" action="/torneios/{{ t.slug }}/editar">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% include "torneios/_campos.html" %}
  <p><button>Salvar</button> <a href="/torneios/{{ t.slug }}">Voltar</a></p>
</form>
</section>
{% endblock %}
