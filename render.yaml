services:
  - type: web
    name: gamelog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && flask --app app seed && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAWG_API_KEY  # só no painel do Render; sem ela a RAWG fica desligada (GOG-03, GOG-07)
        sync: false
      - key: STEAM_API_KEY  # só no painel do Render; sem ela a importação de horas da Steam fica desligada (HRS-05)
        sync: false
