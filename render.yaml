services:
  - type: web
    name: gamelog
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # timeout de 600 s: o POST /jobs/ciclo pode rodar o sync_games (~80 chamadas HTTP de até 5 s) sem o worker ser morto
    startCommand: cd src && flask --app app backup restaurar-inicial && flask --app app seed && flask --app app jobs agendar && gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 2 --timeout 600
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: GAMELOG_PRODUCAO  # senha aleatória no seed, cookie Secure e SECRET_KEY obrigatória
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: RAWG_API_KEY  # só no painel do Render; sem ela a RAWG fica desligada (GOG-03, GOG-07)
        sync: false
      - key: STEAM_API_KEY  # só no painel do Render; sem ela a importação de horas da Steam fica desligada (HRS-05)
        sync: false
      - key: JOBS_TOKEN
        sync: false
      - key: BACKUP_KEY
        sync: false
      - key: BACKUP_RESTAURAR_DE
        sync: false
      - key: URL_PUBLICA  # endereço dos links nos e-mails (descadastro), que saem dos jobs, fora de uma requisição
        value: https://gamelog-92zh.onrender.com
      # e-mail (EML-03): sem SMTP_HOST, o backend de console escreve o e-mail no log
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT  # 465 usa SSL; as outras, STARTTLS (padrão 587)
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: EMAIL_REMETENTE  # ex.: GameLog <nao-responda@seu-dominio>
        sync: false
